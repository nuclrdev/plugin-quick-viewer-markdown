# English texts of the Markdown quick viewer, read through Messages.tr(...).
# Translations: messages_<language>.properties with the same keys; a missing key falls back to this file.
# A text used with arguments ({0}, {1}...) is a MessageFormat pattern: write a literal apostrophe as ''.
# A text used without arguments is shown exactly as written.

# MarkdownQuickViewProvider.java (message.* are rendered as Markdown)
window.title=Quick View: {0}
message.too.large=*“{0}” is too large to preview.*
message.cannot.read=*Could not read this file: {0}*

# FindBar.java
find.match.case=Match case
find.previous=Previous match (Shift+Enter, Shift+F3)
find.next=Next match (Enter, F3)
find.close=Close (Esc)
find.placeholder=Find…
find.no.results=No results

# MarkdownView.java
menu.find=Find…
menu.copy=Copy
menu.copy.html=Copy as HTML
menu.copy.selection.html=Copy Selection as HTML
menu.copy.markdown=Copy Markdown Source
menu.select.all=Select All

# MarkdownRenderer.java (wrapped in * by the code, so it renders in italics)
render.truncated=(truncated)
